[package]
name = "qr_creator"
version = "0.1.0"
edition = "2021"
description = "QR code image generator matching nimiq/qr-creator styling (rounded modules)"
license = "MIT"
repository = "https://github.com/calumk/calumk-rust-qr-creator"
homepage = "https://nimiq.github.io/qr-creator/demo/"
keywords = ["qr", "qrcode", "image", "render"]

[lib]
name = "qr_creator"
path = "src/lib.rs"

[dependencies]
qrcode = "0.14"
image = "0.25"
tiny-skia = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
serde_json = "1.0"
rqrr = "0.10"
